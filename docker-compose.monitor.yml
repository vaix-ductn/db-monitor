# CDC Monitor — Lightweight Stack
# Replaces: Zookeeper + Kafka + kafka-ui + Debezium (saves ~1.25GB RAM)
#
# Run from your project root (where docker-compose.yaml is):
#   docker compose -f docker-compose.yaml -f monitor/docker-compose.monitor.yml up -d
#
# Stop monitor only:
#   docker compose -f docker-compose.yaml -f monitor/docker-compose.monitor.yml stop cdc-reader cdc-redis cdc-dashboard

services:

  # Override db service to enable MySQL binlog (required for CDC)
  # NOTE: First time applying this override will recreate the db container.
  db:
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
    volumes:
      - mysql_monitor_data:/var/lib/mysql

  # Python binlog reader — replaces Debezium + Kafka + Zookeeper
  cdc-reader:
    build:
      context: ./monitor/reader
    container_name: cdc-reader
    depends_on:
      - db
      - cdc-redis
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: andes_cloud
      MYSQL_PASSWORD: andes_cloud
      MYSQL_DATABASE: andes_cloud
      REDIS_HOST: cdc-redis
    networks:
      - andes-cloud-network
      - monitor-net
    restart: always

  cdc-redis:
    image: redis:7-alpine
    container_name: cdc-redis
    networks:
      - monitor-net
    restart: always

  # Node.js dashboard — serves UI + REST API + WebSocket on one port (3001)
  # Replaces the previous Python FastAPI backend + React/nginx frontend
  cdc-dashboard:
    build:
      context: ./monitor/dashboard
    container_name: cdc-dashboard
    depends_on:
      - cdc-redis
    ports:
      - "3001:3001"
    environment:
      REDIS_HOST: cdc-redis
      PORT: 3001
    networks:
      - monitor-net
    restart: always

networks:
  monitor-net:
    driver: bridge

volumes:
  mysql_monitor_data:
